spring:
  application:
    name: strideai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 3
      initialization-fail-timeout: 0

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:strideai-default-secret-change-in-production}
  admin-strava-id: ${ADMIN_STRAVA_ID:93679049}
  ai:
    provider: ${AI_PROVIDER:anthropic}
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  strava:
    client-id: ${STRAVA_CLIENT_ID}
    client-secret: ${STRAVA_CLIENT_SECRET}
    refresh-token: ${STRAVA_REFRESH_TOKEN:}
    api-base-url: https://www.strava.com/api/v3
    token-url: https://www.strava.com/oauth/token
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    api-url: https://api.anthropic.com/v1/messages
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}

logging:
  level:
    org.springframework.jdbc: DEBUG
    com.zaxxer.hikari: INFO
    org.hibernate.SQL: WARN