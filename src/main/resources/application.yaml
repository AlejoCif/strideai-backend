spring:
  application:
    name: strideai-backend

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:strideai}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          strava:
            client-id: ${STRAVA_CLIENT_ID}
            client-secret: ${STRAVA_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/strava"
            scope: read,activity:read_all,profile:read_all
        provider:
          strava:
            authorization-uri: https://www.strava.com/oauth/authorize
            token-uri: https://www.strava.com/oauth/token
            user-info-uri: https://www.strava.com/api/v3/athlete
            user-name-attribute: id

server:
  port: ${PORT:3001}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  strava:
    client-id: ${STRAVA_CLIENT_ID}
    client-secret: ${STRAVA_CLIENT_SECRET}
    refresh-token: ${STRAVA_REFRESH_TOKEN:}
    api-base-url: https://www.strava.com/api/v3
    token-url: https://www.strava.com/oauth/token
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    api-url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514